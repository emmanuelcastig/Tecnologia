server:
  port: 8080
spring:
  application:
    name: "Tecnologia"
  devtools:
    add-properties: false
  r2dbc:
    host: "db_tecnologia"
    port: 5432
    database: "tecnologiadb"
    schema: "public"
    username: "postgres"
    password: 1234
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
